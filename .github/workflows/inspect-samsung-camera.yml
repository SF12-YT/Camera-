name: Inspect Samsung Camera DEX

on:
  push:
    paths:
      - .github/workflows/inspect-samsung-camera.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Camera project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Samsung Camera APK contents
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/SF12-YT/SamsungCamera.git "$RUNNER_TEMP/samsung-camera"

      - name: Decompile DEX files with JADX
        run: |
          set -euo pipefail
          RELEASE_JSON="$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest)"
          TAG="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])' <<< "$RELEASE_JSON")"
          VERSION="${TAG#v}"
          ASSET_URL="$(python3 -c 'import json,sys; j=json.load(sys.stdin); print(next(a["browser_download_url"] for a in j["assets"] if a["name"] == "jadx-" + sys.argv[1] + ".zip"))' "$VERSION" <<< "$RELEASE_JSON")"
          curl -fL "$ASSET_URL" -o "$RUNNER_TEMP/jadx.zip"
          mkdir -p "$RUNNER_TEMP/jadx"
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"
          JADX="$(find "$RUNNER_TEMP/jadx" -type f -path '*/bin/jadx' | head -n 1)"
          test -n "$JADX"
          chmod +x "$JADX"
          mkdir -p "$RUNNER_TEMP/samsung-decompiled"
          "$JADX" -d "$RUNNER_TEMP/samsung-decompiled" \
            "$RUNNER_TEMP/samsung-camera/classes.dex" \
            "$RUNNER_TEMP/samsung-camera/classes2.dex" \
            "$RUNNER_TEMP/samsung-camera/classes3.dex"

      - name: Collect Gallery-related implementation
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/samsung-decompiled"
          mkdir -p gallery-reference/source
          {
            echo "SamsungCamera Gallery-related source matches"
            echo "==========================================="
            rg -n -i -C 35 --glob '*.java' \
              'GalleryActivity|com\\.sec\\.android\\.gallery3d|bucketId|mediaTypes|ACTION_VIEW|ACTION_PICK|ACTION_GET_CONTENT|openGallery|camera.?roll|MediaStore' \
              "$OUT" || true
          } > gallery-reference/matches.txt
          rg -l -i --glob '*.java' \
            'GalleryActivity|com\\.sec\\.android\\.gallery3d|bucketId|mediaTypes|openGallery|camera.?roll' \
            "$OUT" > "$RUNNER_TEMP/matched-files.txt" || true
          while IFS= read -r file; do
            rel="${file#"$OUT"/}"
            mkdir -p "gallery-reference/source/$(dirname "$rel")"
            cp "$file" "gallery-reference/source/$rel"
          done < "$RUNNER_TEMP/matched-files.txt"
          zip -qr samsung-camera-gallery-reference.zip gallery-reference

      - name: Upload Gallery reference
        uses: actions/upload-artifact@v4
        with:
          name: samsung-camera-gallery-reference
          path: samsung-camera-gallery-reference.zip
          if-no-files-found: error
          retention-days: 2
